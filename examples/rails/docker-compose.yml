version: '3.8'

services:
  # PostgreSQL database (for Rails)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rails_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Your Rails application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rails_dev
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    depends_on:
      - db
    networks:
      - app-network

  # Superpilot sidecar for observability
  superpilot:
    build:
      context: ../../
      dockerfile: Dockerfile
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - TARGET_ADDR=app:8081
      - PROXY_MODE=http
    ports:
      - "8080:8080"   # Application traffic (proxied)
      - "9090:9090"   # Metrics endpoint
    depends_on:
      - app
    networks:
      - app-network

volumes:
  postgres_data:
  bundle_cache:

networks:
  app-network:
    driver: bridge
